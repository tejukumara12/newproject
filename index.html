<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Name Greeting</title>
    <style>
      body {
        max-width: 32rem;
        margin: 4rem auto;
        padding: 0 1rem;
        font: 1rem/1.5 system-ui, sans-serif;
      }

      form {
        display: flex;
        gap: 0.5rem;
      }

      input {
        flex: 1;
        min-width: 0;
        padding: 0.6rem;
      }

      button {
        padding: 0.6rem 1rem;
        cursor: pointer;
      }

      #result {
        margin-top: 1.5rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Get an AI greeting</h1>
      <form id="greeting-form">
        <label for="name">Your name</label>
        <input id="name" name="name" autocomplete="name" maxlength="120" required>
        <button type="submit">Generate</button>
      </form>
      <p id="result" aria-live="polite"></p>
    </main>
    <script>
      const form = document.querySelector("#greeting-form");
      const nameInput = document.querySelector("#name");
      const result = document.querySelector("#result");
      const button = form.querySelector("button");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        button.disabled = true;
        result.textContent = "Generating greeting...";

        try {
          const response = await fetch("/greeting", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name: nameInput.value.trim() }),
          });
          const data = await response.json();
          if (!response.ok) {
            throw new Error(data.error || "Could not generate a greeting.");
          }
          result.textContent = data.greeting;
        } catch (error) {
          result.textContent = error.message;
        } finally {
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
